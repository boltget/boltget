<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <title>Boltget (16 px, for dark backgrounds)</title>
  <defs>
    <linearGradient id="st" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="16"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4E6E9"/></linearGradient>
  </defs>
  <rect width="16" height="16" rx="3" fill="url(#st)"/>
  <rect x="0.5" y="0.5" width="15" height="15" rx="2.5" fill="none" stroke="#000000" stroke-opacity="0.22"/>
  <g shape-rendering="crispEdges"><rect x="7" y="1" width="2" height="2" fill="#0A0A0B"/><rect x="7" y="4" width="2" height="2" fill="#0A0A0B"/><rect x="1" y="7" width="2" height="2" fill="#0A0A0B"/><rect x="4" y="7" width="2" height="2" fill="#0A0A0B"/><rect x="7" y="7" width="2" height="2" fill="#0A0A0B"/><rect x="10" y="7" width="2" height="2" fill="#0A0A0B"/><rect x="13" y="7" width="2" height="2" fill="#0A0A0B"/><rect x="4" y="10" width="2" height="2" fill="#0A0A0B"/><rect x="7" y="10" width="2" height="2" fill="#0A0A0B"/><rect x="10" y="10" width="2" height="2" fill="#0A0A0B"/><rect x="7" y="13" width="2" height="2" fill="#0A0A0B"/></g>
</svg>