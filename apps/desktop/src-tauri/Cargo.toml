[package]
name = "boltget-desktop"
description = "BoltGet desktop app: the Tauri shell around the engine"
version.workspace = true
edition.workspace = true
# Tauri 2.12 needs Rust 1.90; the engine and CLI keep the workspace's 1.89.
rust-version = "1.90"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "boltget-desktop"
path = "src/main.rs"

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2.7", features = [] }

[dependencies]
boltget-engine.workspace = true
serde.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"

# Window chrome on Windows (src/platform/windows.rs): the snap-layout overlay,
# DWM attributes and WebView2 settings. Same versions as Tauri's own.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
