# Website (apps/web): type checks and a static build of boltget.app.
# The site reads brand/, CHANGELOG.md and the benchmark results at build time,
# so changes there rebuild it too.
name: Web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "brand/**"
      - "bench/results/**"
      - "CHANGELOG.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "brand/**"
      - "bench/results/**"
      - "CHANGELOG.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Version from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        # Only the site and its workspace dependencies, not brand/ tooling.
        run: pnpm install --frozen-lockfile --filter "@boltget/web..."

      - name: Check
        run: pnpm --filter @boltget/web check

      - name: Build
        run: pnpm --filter @boltget/web build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
