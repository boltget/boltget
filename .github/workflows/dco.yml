# Developer Certificate of Origin check.
# Every non-merge commit in a PR must carry a "Signed-off-by:" trailer that
# matches the commit author. See CONTRIBUTING.md#developer-certificate-of-origin-dco.
#
# Implemented as a small in-repo workflow instead of the third-party DCO GitHub
# App: it is versioned and reviewable here, needs only read access, and grants
# no external app permissions on the organization.
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify sign-off on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          shopt -s nocasematch
          fail=0
          count=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            count=$((count + 1))
            author_name="$(git log -1 --format='%an' "$sha")"
            author_email="$(git log -1 --format='%ae' "$sha")"
            # Bots (e.g. dependabot[bot]) are exempt.
            case "$author_name" in
              *"[bot]") echo "skip $sha (bot: $author_name)"; continue ;;
            esac
            expected="Signed-off-by: ${author_name} <${author_email}>"
            message="$(git log -1 --format='%B' "$sha")"
            if [[ "$message" == *"$expected"* ]]; then
              echo "ok   $sha"
            else
              echo "::error::Commit $sha is missing '$expected'. Fix with 'git rebase --signoff ${BASE_SHA:0:12}' and force-push."
              fail=1
            fi
          done
          echo "Checked $count commit(s)."
          exit $fail
