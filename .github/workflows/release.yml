# Release: builds the standalone CLI and the desktop app's per-user NSIS
# installer for a pushed `v*` tag and attaches them to a draft GitHub Release
# with SHA256SUMS and build provenance. A maintainer reviews the draft and
# publishes it. Nothing is signed until v1.0 (docs/RELEASE.md), so the notes
# of a 0.x or pre-release build say so.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on main and matches Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$version" != "$cargo_version" ]; then
            echo "Tag $TAG does not match workspace version $cargo_version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG does not point to a commit on main" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          # The app's version comes from Cargo.toml; a "version" in the Tauri
          # config would override it.
          if grep -q '"version"' apps/desktop/src-tauri/tauri.conf.json; then
            echo "apps/desktop/src-tauri/tauri.conf.json must not set a version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cargo build --locked --release -p boltget-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          NAME: boltget-${{ needs.guard.outputs.version }}-${{ matrix.asset }}
        run: |
          mkdir -p "dist/$NAME"
          cp LICENSE README.md CHANGELOG.md "dist/$NAME/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/boltget.exe" "dist/$NAME/"
            (cd dist && 7z a -tzip "$NAME.zip" "$NAME" > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/boltget" "dist/$NAME/"
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          fi
          rm -rf "dist/$NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  app:
    name: build (app installer, windows-x64)
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Version from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --filter "@boltget/desktop..."
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      # tauri.installer.conf.json names the binary Boltget.exe. The installer
      # installs for the current user (%LOCALAPPDATA%\Programs\Boltget, no
      # administrator rights) and gives its Start menu shortcut the app id
      # app.boltget.desktop, which notifications need to say "Boltget".
      - name: Build the installer
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          pnpm --filter @boltget/desktop installer -- --locked
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/bundle/nsis/Boltget_${VERSION}_x64-setup.exe" \
            "dist/boltget-${VERSION}-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows-x64
          path: dist/*
          if-no-files-found: error

  publish:
    name: draft release
    needs: [guard, build, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md > changes.md
          test -s changes.md
          # 0.x and pre-release builds are unsigned previews: say so first.
          case "$VERSION" in
            0.*|*-*) cp .github/release-preview-note.md notes.md
                     sed -i "s/{version}/$VERSION/g" notes.md ;;
            *) : > notes.md ;;
          esac
          cat changes.md >> notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          prerelease=""
          title="Boltget $VERSION"
          case "$VERSION" in
            0.*|*-*) prerelease="--prerelease"; title="$title (unsigned preview)" ;;
          esac
          gh release create "$TAG" dist/* --draft $prerelease \
            --title "$title" --notes-file notes.md --verify-tag
