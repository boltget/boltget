# Dependabot version updates.
# Commit messages follow Conventional Commits: "build(deps): ..." / "ci(deps): ...".
# The npm and cargo entries are commented out until the corresponding
# directories and lockfiles exist (Dependabot errors on missing manifests).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels:
      - area:deps
      - area:ci
    groups:
      actions:
        patterns: ["*"]

