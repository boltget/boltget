# Label taxonomy for boltget/boltget. See CONTRIBUTING.md#labels.
# Intended to be applied by a label-sync action (for example
# crazy-max/ghaction-github-labeler or EndBug/label-sync); format:
# name, color (hex without #), description.

# --- type ---
- name: "type:bug"
  color: "d73a4a"
  description: "Something does not work as specified"
- name: "type:feature"
  color: "059669"
  description: "A new capability"
- name: "type:enhancement"
  color: "34d399"
  description: "Improvement to an existing capability"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation"
- name: "type:performance"
  color: "a7f3d0"
  description: "Speed, memory or resource use"
- name: "type:security"
  color: "b60205"
  description: "Security hardening (report vulnerabilities privately, see SECURITY.md)"
- name: "type:refactor"
  color: "c5def5"
  description: "Code change without behaviour change"
- name: "type:question"
  color: "d876e3"
  description: "Question (usually belongs in Discussions)"
- name: "type:rfc"
  color: "5319e7"
  description: "Design proposal under docs/rfcs"

# --- area ---
- name: "area:engine"
  color: "1d3b2f"
  description: "crates/engine: download engine"
- name: "area:cli"
  color: "1d3b2f"
  description: "crates/cli: command-line tool"
- name: "area:desktop"
  color: "1d3b2f"
  description: "apps/desktop: Tauri app"
- name: "area:extension"
  color: "1d3b2f"
  description: "apps/extension: browser extension and native host"
- name: "area:video"
  color: "1d3b2f"
  description: "yt-dlp / ffmpeg integration"
- name: "area:web"
  color: "1d3b2f"
  description: "apps/web: website and user docs"
- name: "area:ui"
  color: "1d3b2f"
  description: "packages/ui: shared components and design tokens"
- name: "area:brand"
  color: "1d3b2f"
  description: "brand/: icon and brand guidelines"
- name: "area:docs"
  color: "1d3b2f"
  description: "docs/: design documents"
- name: "area:build"
  color: "1d3b2f"
  description: "Build system, installer, packaging"
- name: "area:ci"
  color: "1d3b2f"
  description: "GitHub Actions workflows"
- name: "area:deps"
  color: "1d3b2f"
  description: "Dependency updates"

# --- priority ---
- name: "priority:critical"
  color: "b60205"
  description: "Data loss, security, crash on a common path; release blocker"
- name: "priority:high"
  color: "d93f0b"
  description: "Major functionality broken, no workaround"
- name: "priority:medium"
  color: "fbca04"
  description: "Normal priority"
- name: "priority:low"
  color: "e6e6e6"
  description: "Nice to have"

# --- status ---
- name: "status:needs-triage"
  color: "ededed"
  description: "Waiting for a maintainer to triage"
- name: "status:needs-info"
  color: "f9d0c4"
  description: "Waiting for more information from the reporter"
- name: "status:confirmed"
  color: "0e8a16"
  description: "Triaged and ready to work on"
- name: "status:in-progress"
  color: "1d76db"
  description: "Someone is working on it"
- name: "status:blocked"
  color: "000000"
  description: "Blocked by another issue or external factor"
- name: "status:wontfix"
  color: "ffffff"
  description: "Will not be worked on"
- name: "status:duplicate"
  color: "cfd3d7"
  description: "Duplicate of another issue"

# --- platform ---
- name: "platform:windows"
  color: "bfdadc"
  description: "Windows-specific"
- name: "platform:macos"
  color: "bfdadc"
  description: "macOS-specific (post-1.0)"
- name: "platform:linux"
  color: "bfdadc"
  description: "Linux-specific (post-1.0)"

# --- community ---
- name: "good first issue"
  color: "7057ff"
  description: "Well-scoped, with pointers and a mentor; good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "We would welcome someone taking this on"
