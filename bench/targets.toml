# Benchmark targets for `boltget bench` and bench/idm-compare.ps1.
#
# Versioned: change a target's URL, size or hash only together with a note in
# docs/BENCHMARK.md, so published results stay traceable to what was measured.
# Public targets are hosting providers' speed-test files, which exist to be
# downloaded for measurements; use them sparingly (a few runs, not loops).
#
# `{lab}` is replaced by `--lab <URL>` (boltget bench) or the script's own
# boltget-testserver. Lab content is generated (incompressible) from the seed.
version = 1

# --- Public hosts ---

[[target]]
name = "cachefly-10mb"
url = "http://cachefly.cachefly.net/10mb.test"
size = 10485760
sha256 = "e5b844cc57f57094ea4585e235f36c78c1cd222262bb89d53c94dcb4d6b3e55d"
notes = "CacheFly CDN, plain HTTP. Small file: start-up cost dominates."

[[target]]
name = "cachefly-100mb"
url = "http://cachefly.cachefly.net/100mb.test"
size = 104857600
sha256 = "28614fccd52ff53e2d603c8a1968d2c5d3249d2796be558ff9749e3d172d5a8a"
notes = "CacheFly CDN, plain HTTP, nearby edge."

[[target]]
